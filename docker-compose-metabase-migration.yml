version: '3'
services:

  drill-metabase-dashboards-migration:
    image: ghcr.io/drill4j/drill-metabase-dashboards:${DRILL_METABASE_DASHBOARDS_VERSION}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: db-metabase
    networks:
      - docker_default  # Specify network on which PostgreSQL container is running

networks:
  docker_default:
    external: true